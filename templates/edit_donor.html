<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Donor - DonationHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <a href="{{ url_for('home') }}" class="logo">
            Donation<span>Hub</span>
        </a>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>

            <a href="{{ url_for('donors') }}">
                Donors
            </a>
        </div>

    </nav>


    <!-- Main Form Section -->
    <section class="donor-form-section">

        <div class="form-container">

            <p class="section-tag">
                EDIT DONOR
            </p>

            <h1>Update Donor Information</h1>

            <p class="form-description">
                Modify the donor details below and save the changes.
            </p>


            <!-- Edit Form -->
            <form method="POST">

                <div class="form-grid">


                    <!-- First Name -->
                    <div class="form-group">

                        <label>First Name</label>

                        <input
                            type="text"
                            name="first_name"
                            value="{{ donor.first_name }}"
                            required>

                    </div>


                    <!-- Last Name -->
                    <div class="form-group">

                        <label>Last Name</label>

                        <input
                            type="text"
                            name="last_name"
                            value="{{ donor.last_name }}"
                            required>

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            value="{{ donor.email }}"
                            required>

                    </div>


                    <!-- Phone -->
                    <div class="form-group">

                        <label>Phone</label>

                        <input
                            type="text"
                            name="phone"
                            value="{{ donor.phone }}"
                            required>

                    </div>


                    <!-- Address -->
                    <div class="form-group full-width">

                        <label>Address</label>

                        <input
                            type="text"
                            name="address"
                            value="{{ donor.address or '' }}">

                    </div>


                    <!-- City -->
                    <div class="form-group">

                        <label>City</label>

                        <input
                            type="text"
                            name="city"
                            value="{{ donor.city or '' }}">

                    </div>


                    <!-- State -->
                    <div class="form-group">

                        <label>State</label>

                        <input
                            type="text"
                            name="state"
                            value="{{ donor.state or '' }}">

                    </div>


                    <!-- Pincode -->
                    <div class="form-group">

                        <label>Pincode</label>

                        <input
                            type="text"
                            name="pincode"
                            value="{{ donor.pincode or '' }}">

                    </div>


                    <!-- Date of Birth -->
                    <div class="form-group">

                        <label>Date of Birth</label>

                        <input
                            type="date"
                            name="date_of_birth"
                            value="{{ donor.date_of_birth or '' }}">

                    </div>


                    <!-- Gender -->
                    <div class="form-group">

                        <label>Gender</label>

                        <select name="gender">

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male"
                                {% if donor.gender == "Male" %}selected{% endif %}>
                                Male
                            </option>

                            <option value="Female"
                                {% if donor.gender == "Female" %}selected{% endif %}>
                                Female
                            </option>

                            <option value="Other"
                                {% if donor.gender == "Other" %}selected{% endif %}>
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Blood Group -->
                    <div class="form-group">

                        <label>Blood Group</label>

                        <select name="blood_group">

                            <option value="">
                                Select Blood Group
                            </option>

                            <option value="A+"
                                {% if donor.blood_group == "A+" %}selected{% endif %}>
                                A+
                            </option>

                            <option value="A-"
                                {% if donor.blood_group == "A-" %}selected{% endif %}>
                                A-
                            </option>

                            <option value="B+"
                                {% if donor.blood_group == "B+" %}selected{% endif %}>
                                B+
                            </option>

                            <option value="B-"
                                {% if donor.blood_group == "B-" %}selected{% endif %}>
                                B-
                            </option>

                            <option value="AB+"
                                {% if donor.blood_group == "AB+" %}selected{% endif %}>
                                AB+
                            </option>

                            <option value="AB-"
                                {% if donor.blood_group == "AB-" %}selected{% endif %}>
                                AB-
                            </option>

                            <option value="O+"
                                {% if donor.blood_group == "O+" %}selected{% endif %}>
                                O+
                            </option>

                            <option value="O-"
                                {% if donor.blood_group == "O-" %}selected{% endif %}>
                                O-
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Form Buttons -->
                <div class="form-buttons">

                    <a href="{{ url_for('donors') }}"
                       class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit"
                            class="submit-btn">
                        Update Donor
                    </button>

                </div>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Donation Management System |
            Developed by Yash Karande
        </p>

    </footer>

</body>

</html>
