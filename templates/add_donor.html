<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Donor - DonationHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <a href="{{ url_for('home') }}" class="logo">
            Donation<span>Hub</span>
        </a>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>

            <a href="{{ url_for('donors') }}" class="active">
                Donors
            </a>
        </div>

    </nav>


    <!-- Add Donor Form -->
    <section class="donor-form-section">

        <div class="form-container">

            <p class="section-tag">
                NEW DONOR
            </p>

            <h1>Add New Donor</h1>

            <p class="form-description">
                Enter the donor information below to create a new donor record.
            </p>


            <form method="POST">

                <div class="form-grid">

                    <!-- First Name -->
                    <div class="form-group">
                        <label>First Name</label>

                        <input
                            type="text"
                            name="first_name"
                            required>
                    </div>


                    <!-- Last Name -->
                    <div class="form-group">
                        <label>Last Name</label>

                        <input
                            type="text"
                            name="last_name"
                            required>
                    </div>


                    <!-- Email -->
                    <div class="form-group">
                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            required>
                    </div>


                    <!-- Phone -->
                    <div class="form-group">
                        <label>Phone</label>

                        <input
                            type="text"
                            name="phone"
                            required>
                    </div>


                    <!-- Address -->
                    <div class="form-group full-width">
                        <label>Address</label>

                        <textarea
                            name="address"
                            rows="3"></textarea>
                    </div>


                    <!-- City -->
                    <div class="form-group">
                        <label>City</label>

                        <input
                            type="text"
                            name="city">
                    </div>


                    <!-- State -->
                    <div class="form-group">
                        <label>State</label>

                        <input
                            type="text"
                            name="state">
                    </div>


                    <!-- Pincode -->
                    <div class="form-group">
                        <label>Pincode</label>

                        <input
                            type="text"
                            name="pincode">
                    </div>


                    <!-- Date of Birth -->
                    <div class="form-group">
                        <label>Date of Birth</label>

                        <input
                            type="date"
                            name="date_of_birth">
                    </div>


                    <!-- Gender -->
                    <div class="form-group">
                        <label>Gender</label>

                        <select name="gender">

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>
                    </div>


                    <!-- Blood Group -->
                    <div class="form-group">
                        <label>Blood Group</label>

                        <select name="blood_group">

                            <option value="">
                                Select Blood Group
                            </option>

                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>

                        </select>
                    </div>

                </div>


                <!-- Form Buttons -->
                <div class="form-buttons">

                    <a href="{{ url_for('donors') }}"
                       class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit"
                            class="submit-btn">
                        Save Donor
                    </button>

                </div>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Donation Management System |
            Developed by Yash Karande
        </p>

    </footer>

</body>

</html>
